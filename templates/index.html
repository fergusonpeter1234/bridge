<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYC Bridge Practice Table</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root {
            --bg-felt: #1a4329;
            --felt-inner: #245c38;
            --felt-border: #0d2818;
            --panel-bg: #111a15;
            --card-red: #d90429;
            --card-black: #1e1e24;
            --accent: #52b788;
            --gold: #ffb703;
        }

        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #08120c;
            color: #f8f9fa;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
        }

        /* Bridge Table */
        .table-container {
            background: radial-gradient(circle, var(--felt-inner) 60%, var(--bg-felt) 100%);
            border: 12px solid var(--felt-border);
            border-radius: 24px;
            height: 720px;
            position: relative;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Player Seats */
        .seat {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 5;
        }
        .seat-North { top: 15px; }
        .seat-South { bottom: 15px; }
        .seat-West { left: 20px; top: 50%; transform: translateY(-50%); }
        .seat-East { right: 20px; top: 50%; transform: translateY(-50%); }

        .seat-tag {
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 6px;
        }
        .seat-tag.active {
            background: var(--gold);
            color: black;
            border-color: #fff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Playing Cards */
        .hand {
            display: flex;
            justify-content: center;
            min-height: 80px;
        }
        .card {
            width: 48px;
            height: 72px;
            background: #ffffff;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            font-weight: 800;
            font-size: 14px;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin: 0 -8px;
        }
        .card.playable {
            cursor: pointer;
        }
        .card.playable:hover {
            transform: translateY(-16px) scale(1.1);
            z-index: 100 !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }
        .card.red { color: var(--card-red); }
        .card.black { color: var(--card-black); }
        
        .card-back {
            width: 32px;
            height: 52px;
            background: repeating-linear-gradient(45deg, #1b4965, #1b4965 5px, #2b2d42 5px, #2b2d42 10px);
            border: 2px solid white;
            border-radius: 4px;
            margin: 0 -10px;
        }

        /* Trick Zone */
        .trick-zone {
            width: 240px;
            height: 240px;
            background: rgba(0,0,0,0.25);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 16px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .trick-card { position: absolute; }
        .trick-card.pos-South { bottom: 20px; }
        .trick-card.pos-North { top: 20px; }
        .trick-card.pos-West { left: 20px; }
        .trick-card.pos-East { right: 20px; }

        /* Side Panel */
        .sidebar {
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-height: 720px;
            overflow-y: auto;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px 4px;
            border-radius: 6px;
            border: 1px solid #365949;
            background: #1d2e24;
            color: white;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .mode-btn.active {
            background: var(--accent);
            color: black;
            border-color: #fff;
        }

        .coach-card {
            background: #19271f;
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 12px;
        }
        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-optimal { background: #2dc653; color: black; }
        .badge-acceptable { background: var(--gold); color: black; }

        /* Bidding Box */
        .bidding-box {
            background: #16221c;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #2d4a3e;
        }
        .bid-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }
        .bid-btn {
            background: #22382e;
            color: #fff;
            border: 1px solid #365949;
            padding: 8px 4px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .bid-btn:hover:not(:disabled) {
            background: var(--accent);
            color: black;
        }
        .bid-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }
        .bid-btn.pass { background: #2b9348; grid-column: span 5; }

        .contract-banner {
            background: #2d4035;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="layout">
    <div class="table-container">
        <div class="seat seat-North" id="seat-North">
            <div class="seat-tag" id="tag-North">North (Bot)</div>
            <div class="hand" id="hand-North"></div>
        </div>

        <div class="seat seat-West" id="seat-West">
            <div class="seat-tag" id="tag-West">West (Bot)</div>
            <div class="hand" id="hand-West"></div>
        </div>

        <div class="trick-zone" id="trick-zone"></div>

        <div class="seat seat-East" id="seat-East">
            <div class="seat-tag" id="tag-East">East (Bot)</div>
            <div class="hand" id="hand-East"></div>
        </div>

        <div class="seat seat-South" id="seat-South">
            <div class="hand" id="hand-South"></div>
            <div class="seat-tag" id="tag-South" style="margin-top: 6px;">South (You)</div>
        </div>
    </div>

    <div class="sidebar">
        <div>
            <h3 style="margin: 0 0 8px 0;">Game Mode</h3>
            <div class="mode-selector">
                <button class="mode-btn active" id="btn-single" onclick="setMode('single')">Solo SAYC Practice</button>
                <button class="mode-btn" id="btn-multi" onclick="setMode('multi')">2-Player Table</button>
            </div>
        </div>

        <div class="contract-banner">
            <span id="banner-contract">Contract: Passing...</span>
            <span id="banner-tricks">NS 0 - 0 EW</span>
        </div>

        <div class="coach-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: bold; font-size: 13px;">SAYC Coach Advice</span>
                <span class="badge badge-optimal" id="advice-badge">Optimal</span>
            </div>
            <div id="advice-target" style="font-size: 18px; font-weight: 800; color: var(--gold); margin: 6px 0;">--</div>
            <div id="advice-reason" style="font-size: 12px; line-height: 1.4; color: #d8f3dc;">Waiting for turn...</div>
        </div>

        <div class="bidding-box" id="bidding-box" style="display: none;">
            <div style="font-weight: bold; font-size: 12px; margin-bottom: 8px;">Your Turn to Bid (SAYC):</div>
            <div class="bid-grid" id="bid-buttons"></div>
            <button class="bid-btn pass" onclick="makeBid('PASS')">PASS</button>
        </div>

        <button class="bid-btn" id="new-hand-btn" style="display: none; background: var(--accent); color: black;" onclick="socket.emit('new_deal')">Deal Next Hand</button>

        <div>
            <h4 style="margin: 0 0 6px 0;">Action & Coach Log</h4>
            <div id="action-log" style="font-size: 12px; max-height: 200px; overflow-y: auto; background: #0c1510; padding: 8px; border-radius: 8px;"></div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let mySeat = "South";
    socket.emit('join_game', { role: mySeat });

    const STRAINS = ['♣', '♦', '♥', '♠', 'NT'];

    function setMode(mode) {
        if (mode === 'multi') {
            mySeat = prompt("Choose Seat for 2-Player Table (South or North):", "South") || "South";
        } else {
            mySeat = "South";
        }
        document.getElementById('btn-single').className = `mode-btn ${mode === 'single' ? 'active' : ''}`;
        document.getElementById('btn-multi').className = `mode-btn ${mode === 'multi' ? 'active' : ''}`;
        socket.emit('set_mode', { mode: mode });
    }

    function setupBiddingBox(highestBid) {
        const container = document.getElementById('bid-buttons');
        container.innerHTML = '';
        const highestVal = highestBid ? (highestBid.level * 5 + STRAINS.indexOf(highestBid.strain)) : -1;

        for (let level = 1; level <= 7; level++) {
            STRAINS.forEach((strain, sIdx) => {
                const btn = document.createElement('button');
                btn.className = 'bid-btn';
                btn.innerText = `${level}${strain}`;
                const val = level * 5 + sIdx;

                if (val <= highestVal) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => makeBid(`${level}${strain}`);
                }
                container.appendChild(btn);
            });
        }
    }

    function makeBid(bid) {
        socket.emit('make_bid', { bid: bid });
    }

    socket.on('game_update', (data) => {
        // Seat Label Updates
        ['North', 'East', 'South', 'West'].forEach(seat => {
            const tag = document.getElementById(`tag-${seat}`);
            let label = `${seat}`;
            if (seat === mySeat) label += ' (You)';
            else if (data.mode === 'single' || seat === 'East' || seat === 'West') label += ' (Bot)';
            
            if (data.contract && data.contract.declarer === seat) label += ' [DECL]';
            if (data.contract && data.contract.dummy === seat) label += ' [DUMMY]';
            if (data.dealer === seat) label += ' (D)';

            tag.innerText = label;
            tag.className = `seat-tag ${data.current_seat === seat ? 'active' : ''}`;
        });

        // Banner Updates
        if (data.contract) {
            document.getElementById('banner-contract').innerText = 
                `Contract: ${data.contract.level}${data.contract.strain} by ${data.contract.declarer}`;
        } else {
            document.getElementById('banner-contract').innerText = `Phase: ${data.phase}`;
        }
        document.getElementById('banner-tricks').innerText = `NS ${data.tricks_won.NS} - ${data.tricks_won.EW} EW`;

        // Coach Advice Updates
        if (data.advice) {
            document.getElementById('advice-target').innerText = `Target: ${data.advice.best}`;
            document.getElementById('advice-reason').innerText = data.advice.reason;
        }

        // Bidding Box Visibility
        const isMyBid = (data.phase === 'BIDDING' && data.current_seat === mySeat);
        document.getElementById('bidding-box').style.display = isMyBid ? 'block' : 'none';
        if (isMyBid) setupBiddingBox(data.highest_bid);

        document.getElementById('new-hand-btn').style.display = (data.phase === 'HAND_OVER') ? 'block' : 'none';

        // Render Hands
        ['North', 'East', 'South', 'West'].forEach(seat => {
            const handEl = document.getElementById(`hand-${seat}`);
            handEl.innerHTML = '';

            const isDummy = (data.contract && data.contract.dummy === seat);
            const isVisible = (seat === mySeat) || (isDummy && data.dummy_revealed);

            // True Declarer/Dummy Logic: Declarer clicks Dummy cards on Dummy's turn
            const isMyTurnToPlayThisSeat = (data.phase === 'PLAY' && data.current_seat === seat) &&
                (seat === mySeat || (isDummy && data.contract.declarer === mySeat));

            data.hands[seat].forEach((card, idx) => {
                if (isVisible) {
                    const c = document.createElement('div');
                    c.className = `card ${['♥','♦'].includes(card.suit) ? 'red' : 'black'} ${isMyTurnToPlayThisSeat ? 'playable' : ''}`;
                    c.style.zIndex = idx;
                    c.innerHTML = `<div>${card.rank}</div><div>${card.suit}</div>`;

                    if (isMyTurnToPlayThisSeat) {
                        c.onclick = () => socket.emit('play_card', { card: card, source_seat: seat });
                    }
                    handEl.appendChild(c);
                } else {
                    const cb = document.createElement('div');
                    cb.className = 'card-back';
                    handEl.appendChild(cb);
                }
            });
        });

        // Render Active Trick
        const trickArea = document.getElementById('trick-zone');
        trickArea.innerHTML = '';
        data.trick.forEach(p => {
            const el = document.createElement('div');
            el.className = `card trick-card pos-${p.seat} ${['♥','♦'].includes(p.card.suit) ? 'red' : 'black'}`;
            el.innerHTML = `<div>${p.card.rank}</div><div>${p.card.suit}</div>`;
            trickArea.appendChild(el);
        });

        // History Log
        const log = document.getElementById('action-log');
        log.innerHTML = '';
        data.bids.forEach(b => {
            const item = document.createElement('div');
            item.style.marginBottom = '4px';
            item.innerHTML = `<strong>${b.seat}:</strong> Bid ${b.bid} <span class="badge badge-${b.status}">${b.status}</span><br><span style="color:#adb5bd;font-size:11px;">${b.feedback}</span>`;
            log.appendChild(item);
        });
    });

    socket.on('error_message', (d) => alert(d.msg));
</script>
</body>
</html>
